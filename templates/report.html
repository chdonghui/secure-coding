{% extends "base.html" %}
{% block title %}신고하기{% endblock %}
{% block content %}
<h2>신고하기</h2>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  신고 대상 유형:
  <select name="target_type" required>
    <option value="">선택</option>
    <option value="user">사용자</option>
    <option value="product">상품</option>
  </select><br>
  신고 대상 ID:
  <input
    type="text"
    name="target_id"
    minlength="36"
    maxlength="36"
    autocomplete="off"
    required
  ><br>
  신고 사유: <br>
  <p>
    이메일, 전화번호, 주민등록번호 등 개인정보는 입력하지 마세요.
  </p>
  <textarea
    name="reason"
    rows="4"
    cols="50"
    minlength="10"
    maxlength="1000"
    required
  ></textarea><br>
  <button type="submit">신고 접수</button>
</form>
{% endblock %}
