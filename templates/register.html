{% extends "base.html" %}
{% block title %}회원가입{% endblock %}
{% block content %}
<h2>회원가입</h2>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  사용자명:
  <input
    type="text"
    name="username"
    minlength="3"
    maxlength="30"
    autocomplete="username"
    required
  ><br>
  비밀번호:
  <input
    type="password"
    name="password"
    minlength="12"
    maxlength="128"
    autocomplete="new-password"
    required
  ><br>
  <p>비밀번호는 12자 이상이며 문자와 숫자를 각각 하나 이상 포함해야 합니다.</p>
  <button type="submit">회원가입</button>
</form>
{% endblock %}
